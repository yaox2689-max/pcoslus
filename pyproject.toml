[project]
name = "pcos-runtime"
version = "0.1.0"
description = "Personal Cognitive Operating System - Decision Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai>=1.12.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.3",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]
